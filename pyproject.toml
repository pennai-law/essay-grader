[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "essay-grader"
version = "0.1.0"
description = "Rubric-locked, dual-grader (Claude + OpenAI Decisions) essay exam grading pipeline with human review."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "anthropic>=1.0",
  "openai>=1.50",
  "pydantic>=2",
  "pyyaml>=6",
  "pypdf>=4",
  "python-docx>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
essay-grader = "essay_grader.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
